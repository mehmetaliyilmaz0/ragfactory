name: CI

on:
  pull_request:
  push:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api]" build twine

      - name: Static checks
        run: |
          ruff check .
          ruff format . --check
          mypy ragfactory

      - name: Run full test suite
        run: python -m pytest -q

      - name: Build distribution artifacts
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Verify packaged template assets
        run: >
          python -c "import pathlib, zipfile; wheel = next(pathlib.Path('dist').glob('*.whl'));
          required = 'ragfactory/templates/entrypoints/common/.env.example.j2';
          names = set(zipfile.ZipFile(wheel).namelist());
          assert required in names, f'Missing {required} in {wheel}'"

  generated-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: langchain
            retrieval: hybrid_rrf
          - framework: llamaindex
            retrieval: dense
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator
        run: python -m pip install -e ".[dev,api]"
      - name: Generate and install standalone project
        run: |
          ragfactory init --name sdk-smoke --framework ${{ matrix.framework }} --vector-db qdrant --retrieval ${{ matrix.retrieval }} --output /tmp/ragfactory-sdk-smoke
          python -m pip install /tmp/ragfactory-sdk-smoke
          python -m pip check
      - name: Run generated pipeline with real SDKs and local retrieval
        env:
          RAGFACTORY_SDK_SMOKE: ${{ matrix.framework }}
        run: python -m pytest tests/integration/test_generated_runtime.py -q

  generated-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate evaluation project and install its dependencies
        run: |
          python -m pip install -e ".[dev,api]"
          python - <<'PY'
          from pathlib import Path
          from ragfactory.core.config import RAGPipelineConfig
          from ragfactory.core.generator import generate
          config = RAGPipelineConfig.model_validate({
              "name": "eval-smoke", "retrieval": {"type": "dense"},
              "indexing": {"embedding": {"type": "openai"}, "vector_db": {"type": "qdrant"}},
              "generation": {"llm": {"type": "openai"}},
              "evaluation": {"framework": "both"},
          })
          result = generate(config)
          assert result.validation_passed, result.errors
          output = Path("/tmp/ragfactory-eval-smoke")
          output.mkdir()
          for name, content in result.files.items():
              (output / name).write_text(content, encoding="utf-8")
          PY
          python -m pip install /tmp/ragfactory-eval-smoke
          python -m pip check
      - name: Check real evaluation scoring and constructors without API calls
        env:
          RAGFACTORY_EVAL_SMOKE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
        run: python -m pytest tests/integration/test_generated_evaluation.py -q
